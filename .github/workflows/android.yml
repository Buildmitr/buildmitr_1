# Builds the BuildMitr Android app (APK) whenever the android/ folder changes, and publishes it as the
# "android-latest" release. The signing key is created once and kept in a private draft release.
name: Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Sign
        shell: bash
        run: |
          set -o pipefail
          {
            set -e
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"; echo "SDK=$SDK"
            BT=$(dirname "$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)"); echo "build-tools: $BT"
            APK=$(find "$GITHUB_WORKSPACE" -name '*release*.apk' -not -name 'aligned.apk' | head -1); echo "apk: $APK"
            [ -n "$APK" ] || { find "$GITHUB_WORKSPACE" -maxdepth 4 -type d -name build; exit 3; }
            "$BT/zipalign" -p -f 4 "$APK" aligned.apk
            "$BT/apksigner" sign --ks keys/buildmitr.jks --ks-pass file:keys/key.txt --ks-key-alias buildmitr --key-pass file:keys/key.txt --out BuildMitr.apk aligned.apk
            "$BT/apksigner" verify --print-certs BuildMitr.apk
            printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.buildmitr.app","sha256_cert_fingerprints":["%s"]}}]\n' "$(cat sha256.txt)" > assetlinks.json
          } 2>&1 | tee -a build.log
      - name: Publish
        shell: bash
        run: |
          set -o pipefail
          {
            gh release delete android-latest -y --cleanup-tag || true
            gh release create android-latest --title "BuildMitr for Android" \
              --notes "Install BuildMitr.apk on Android (allow install from this source when asked). Built from commit ${GITHUB_SHA::7}." \
              BuildMitr.apk assetlinks.json
          } 2>&1 | tee -a build.log
      - name: Save the log if the build failed
        if: failure()
        run: |
          gh release delete ci-log -y --cleanup-tag || true
          { echo "== env"; env | grep -i android || true; ls /usr/local/lib/android/sdk/build-tools 2>&1 || true; } >> build.log; gh release create ci-log --draft --title "Android build log" --notes "Build failed" build.log
