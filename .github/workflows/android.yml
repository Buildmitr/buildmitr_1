# Builds the BuildMitr Android app (APK for direct install + AAB for Google Play) whenever the android/ folder changes, and publishes it as the
# "android-latest" release. The signing key is created once and kept in a private draft release.
name: Android app
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Signing key
        shell: bash
        run: |
          set -e
          mkdir -p keys
          if gh release download signing-key -p buildmitr.jks -p key.txt -D keys; then echo "Using the saved key"; else
            PASS=$(openssl rand -hex 16); echo -n "$PASS" > keys/key.txt
            keytool -genkeypair -keystore keys/buildmitr.jks -alias buildmitr -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=BuildMitr, O=BuildMitr, C=IN"
            gh release create signing-key --draft --title "Signing key (private - do not publish)" --notes "Keep private. Needed to update the app." keys/buildmitr.jks keys/key.txt
          fi
          keytool -list -v -keystore keys/buildmitr.jks -storepass "$(cat keys/key.txt)" | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //' > sha256.txt
          echo "key: $(cat sha256.txt)" | tee -a build.log
      - name: Build
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle assembleRelease bundleRelease -Pvcode=$((100 + GITHUB_RUN_NUMBER)) --no-daemon --stacktrace 2>&1 | tee -a ../build.log
      - name: Sign
        shell: bash
        run: |
          set -o pipefail
          {
            set -e
            SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"; echo "SDK=$SDK"
            BT=$(dirname "$(find "$SDK/build-tools" -name apksigner -type f | sort -V | tail -1)"); echo "build-tools: $BT"
            APK=$(find "$GITHUB_WORKSPACE" -name '*release*.apk' -not -name 'aligned.apk' | head -1); echo "apk: $APK"
            [ -n "$APK" ] || { find "$GITHUB_WORKSPACE" -maxdepth 4 -type d -name build; exit 3; }
            export KSP="$(cat keys/key.txt)"
            "$BT/zipalign" -p -f 4 "$APK" aligned.apk
            "$BT/apksigner" sign --ks keys/buildmitr.jks --ks-pass env:KSP --ks-key-alias buildmitr --key-pass env:KSP --out BuildMitr.apk aligned.apk
            "$BT/apksigner" verify --print-certs BuildMitr.apk
            AAB=$(find "$GITHUB_WORKSPACE/android" -name '*release*.aab' | head -1); echo "aab: $AAB"
            [ -n "$AAB" ] || exit 4
            cp "$AAB" BuildMitr.aab
            jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore keys/buildmitr.jks -storepass:env KSP -keypass:env KSP BuildMitr.aab buildmitr
            jarsigner -verify BuildMitr.aab | tail -1
            # Fingerprints the website trusts: our key, plus Google Play's app-signing key (android/play-signing-sha256.txt, from Play Console > App integrity)
            FP="\"$(cat sha256.txt)\""
            if [ -s android/play-signing-sha256.txt ]; then FP="$FP,\"$(tr -d ' \r\n' < android/play-signing-sha256.txt)\""; fi
            printf '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"com.buildmitr.app","sha256_cert_fingerprints":[%s]}}]\n' "$FP" > assetlinks.json
            cat assetlinks.json
          } 2>&1 | tee -a build.log
      - name: Publish
        shell: bash
        run: |
          set -o pipefail
          {
            gh release delete android-latest -y --cleanup-tag || true
            gh release create android-latest --title "BuildMitr for Android" \
              --notes "BuildMitr.apk: install directly on Android (allow install from this source when asked). BuildMitr.aab: upload this one to Google Play Console. Version code $((100 + GITHUB_RUN_NUMBER)), commit ${GITHUB_SHA::7}." \
              BuildMitr.apk BuildMitr.aab assetlinks.json
          } 2>&1 | tee -a build.log
      - name: Save the log if the build failed
        if: failure()
        run: |
          gh release delete ci-log -y --cleanup-tag || true
          { echo "== env"; env | grep -i android || true; ls /usr/local/lib/android/sdk/build-tools 2>&1 || true; } >> build.log; gh release create ci-log --draft --title "Android build log" --notes "Build failed" build.log
