# Builds the BuildMitr Windows app (installer BuildMitr-Setup.exe for Windows 10 / 11) whenever the desktop/ folder
# changes, and publishes it as the "windows-latest" release. The app opens the live BuildMitr site; from 1.3.0 it also updates itself from this release (latest.yml).
name: Windows app
on:
  push:
    branches: [main]
    paths: ['desktop/**', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Self-test the work tracker
        working-directory: desktop
        run: |
          set -o pipefail
          node selftest.js 2>&1 | tee ../build.log
      - name: Build
        working-directory: desktop
        run: |
          set -o pipefail
          { npm install --no-audit --no-fund && npm run dist; ls -la dist; npx -y @electron/asar list dist/win-unpacked/resources/app.asar | grep -c electron-updater; } 2>&1 | tee -a ../build.log
      - name: Publish
        run: |
          set -o pipefail
          {
            gh release delete windows-latest -y --cleanup-tag || true
            gh release create windows-latest --title "BuildMitr for Windows" \
              --notes "Download BuildMitr-Setup.exe and open it to install BuildMitr on Windows 10 / 11. If Windows shows 'Windows protected your PC', click More info → Run anyway. Built from commit ${GITHUB_SHA::7}." \
              desktop/dist/BuildMitr-Setup.exe desktop/dist/latest.yml desktop/dist/BuildMitr-Setup.exe.blockmap
          } 2>&1 | tee -a build.log
      - name: Save the log if the build failed
        if: failure()
        run: |
          gh release delete ci-log-win -y --cleanup-tag || true
          gh release create ci-log-win --draft --title "Windows build log" --notes "Build failed" build.log
