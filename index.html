<title>BuildMitr</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://script.google.com"><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: grouped vertical menu (Projects, Library, Progress, Manage, Money) + project switcher bar + work area */
:root{
  --bg:#f4f6f5; --panel:#ffffff; --ink:#1a2420; --muted:#5d6c66; --line:#dce3e0;
  --accent:#2f6b4f; --accent-soft:#e2efe8; --on-accent:#ffffff; --side:#1f3a2e; --side-ink:#e6f0eb; --side-on:#ffffff; --side-hi:#2f5443; --side-icon:#9fe0bd;
  --grey:#eceff0; --grey-ink:#5b676c; --blue:#ddeefb; --blue-ink:#1d5f93; --green:#dcf2e3; --green-ink:#21734a; --amber:#fbefd5; --amber-ink:#8a5a07; --red:#fbe3df; --red-ink:#a33a2c;
  --f-display:"Sora","Noto Sans Telugu","Noto Sans Devanagari","Nirmala UI","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree","Noto Sans Telugu","Noto Sans Devanagari","Nirmala UI","Gautami","Mangal","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101614; --panel:#17201c; --ink:#e3ece8; --muted:#93a59d; --line:#26332e;
  --accent:#7cc4a0; --accent-soft:#1c3329; --on-accent:#0c1a13; --side:#14231c; --side-ink:#dfeae4; --side-on:#ffffff; --side-hi:#26402f; --side-icon:#9fe0bd;
  --grey:#222d29; --grey-ink:#a6b4ae; --blue:#183247; --blue-ink:#8cc4ee; --green:#173a28; --green-ink:#86d6a8; --amber:#3b2f16; --amber-ink:#f0c674; --red:#3d1f1a; --red-ink:#f29b8c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101614; --panel:#17201c; --ink:#e3ece8; --muted:#93a59d; --line:#26332e;
  --accent:#7cc4a0; --accent-soft:#1c3329; --on-accent:#0c1a13; --side:#14231c; --side-ink:#dfeae4; --side-on:#ffffff; --side-hi:#26402f; --side-icon:#9fe0bd;
  --grey:#222d29; --grey-ink:#a6b4ae; --blue:#183247; --blue-ink:#8cc4ee; --green:#173a28; --green-ink:#86d6a8; --amber:#3b2f16; --amber-ink:#f0c674; --red:#3d1f1a; --red-ink:#f29b8c; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;stroke-width:1.6;flex:none}

.app{display:grid;grid-template-columns:auto 1fr;min-height:100%}
.side{grid-column:1;grid-row:1;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:2px;padding:12px 10px 16px max(10px,env(safe-area-inset-left,0px));position:sticky;top:0;height:100vh;overflow-y:auto;overflow-x:hidden;width:248px;transition:width .2s ease;z-index:21;scrollbar-width:thin}
.side-top{display:flex;align-items:center;gap:10px;padding:2px 2px 10px 12px}
.burger{display:grid;place-items:center;width:40px;height:40px;border-radius:8px;border:1px solid var(--side-hi);background:var(--side-hi);color:var(--side-on);flex:none;margin-left:auto}
.burger svg.i{width:22px;height:22px}
.burger:hover{background:var(--side-hi)}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;color:var(--side-on);letter-spacing:-.01em;white-space:nowrap}
.org{font-size:12px;padding:0 12px 10px;color:var(--side-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav,.gh{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:7px;border:0;background:none;text-align:left;width:100%;color:var(--side-ink);font-weight:500;font-size:14px;white-space:nowrap}
.nav:hover,.gh:hover{background:var(--side-hi);color:var(--side-on)}
.nav.on{background:var(--side-hi);color:var(--side-on);box-shadow:inset 3px 0 0 var(--accent)}
.gh.has{color:var(--side-on)}
.gh .chev{margin-left:auto;transition:transform .2s;width:16px;height:16px}
.gh.open .chev{transform:rotate(180deg)}
.subs{display:flex;flex-direction:column;gap:1px;margin:0 0 4px 0;padding-left:16px;border-left:1px solid var(--side-hi);margin-left:21px}
.subs .nav{padding:7px 10px;font-size:13.5px}
.side .grow{flex:1;min-height:12px}
.gh.sup{font-weight:600;color:var(--side-on)}
.supsubs{padding-left:8px;margin-left:21px}
.supsubs .gh.sub2{padding:8px 10px;font-size:13.5px}
.supsubs .gh.sub2 svg.i{width:18px;height:18px}
.supsubs .subs{margin-left:19px;padding-left:12px}
.supsubs .subs .nav{font-size:13px;padding:6px 10px}
.lbl{overflow:hidden;text-overflow:ellipsis}
.side svg.i{width:20px;height:20px;color:var(--side-icon);stroke-width:2}
.side .nav.on svg.i,.side .gh.has svg.i{color:var(--side-on)}
.side .burger svg.i{color:var(--side-on)}
.side .chev{color:var(--side-ink)!important}
/* collapsed: icons only */
.app.collapsed .side{width:68px}
.app.collapsed .brand,.app.collapsed .org,.app.collapsed .lbl,.app.collapsed .chev,.app.collapsed .subs{display:none}
.app.collapsed .nav,.app.collapsed .gh{justify-content:center;padding:10px 0}
.app.collapsed .side-top{justify-content:center;padding-left:2px}
.app.collapsed .burger{margin-left:0}
.scrim{display:none}
.main{grid-column:2;grid-row:1;min-width:0;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-family:var(--f-display);font-size:22px;font-weight:600;margin:0;letter-spacing:-.02em;flex:1;min-width:0;text-wrap:balance}
.menu-btn{display:none;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px}
.psw{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0 0 0 10px;max-width:100%}
.psw select{border:0;background:none;padding:8px 10px 8px 0;min-width:0;max-width:260px}

select,input,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 13px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:none}
.btn.warn{color:var(--red-ink)}

.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;min-width:0}
.box-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.box-h h2{font-family:var(--f-display);font-size:15px;font-weight:600;margin:0;flex:1}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0}
.tile{padding:16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.tile b{display:block;font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:13px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}

.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td.acts{white-space:nowrap;text-align:right}
td .thumbs{display:flex;gap:4px}
td .thumbs img{width:34px;height:34px;border-radius:6px;object-fit:cover}
.empty{padding:32px 16px;color:var(--muted);text-align:center}
.hero-empty{padding:44px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.hero-empty h2{font-family:var(--f-display);margin:0;font-size:18px}
.hero-empty p{margin:0;color:var(--muted);max-width:48ch}
.code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.pill{font-size:12px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap;display:inline-block}
.p-grey{background:var(--grey);color:var(--grey-ink)} .p-blue{background:var(--blue);color:var(--blue-ink)}
.p-green{background:var(--green);color:var(--green-ink)} .p-amber{background:var(--amber);color:var(--amber-ink)} .p-red{background:var(--red);color:var(--red-ink)}
.prog{height:6px;background:var(--grey);border-radius:6px;overflow:hidden;min-width:70px}
.prog i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line)}
.filters input{max-width:260px}
.filters select{width:auto}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left}
.pcard:hover{border-color:var(--accent)}
.pcard h3{margin:0;font-family:var(--f-display);font-size:16px;font-weight:600}
.meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg.i{width:14px;height:14px}

.drawer{position:fixed;inset:0;background:rgb(0 0 0 / .35);z-index:30;display:flex;justify-content:flex-end}
.drawer .pane{background:var(--panel);width:min(460px,100%);height:100%;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.pane-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.pane-h h2{font-family:var(--f-display);font-size:17px;font-weight:600;margin:0;flex:1}
.pane-b{flex:1;overflow:auto;padding:16px 18px;display:grid;gap:12px;align-content:start}
.pane-b label{font-size:13px;color:var(--muted);display:grid;gap:4px}
.pane-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}
.qa-fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:25;width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:30px;line-height:1;font-weight:400;box-shadow:0 6px 20px rgb(0 0 0 / .25)}
.qa-drawer{align-items:flex-end;justify-content:center}.qa-drawer .pane{width:min(560px,100%);border-radius:14px 14px 0 0}
.qa-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;padding:16px}
.qa-btn{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-weight:600;font-size:13.5px;text-align:center}
.qa-btn svg.i{width:26px;height:26px;color:var(--accent)}.qa-btn:hover{border-color:var(--accent)}
.bell{position:relative;padding:8px 10px}.bell-n{position:absolute;top:-6px;right:-6px;background:var(--red-ink);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;font-weight:700}
.ai-fab{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:25;display:flex;align-items:center;gap:8px;border:0;border-radius:28px;padding:12px 18px;background:var(--accent);color:var(--on-accent);font-weight:600;box-shadow:0 6px 20px rgb(0 0 0 / .25)}
.ai-fab svg.i{width:20px;height:20px}
.ai-panel{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(420px,calc(100vw - 32px));height:min(620px,calc(100vh - 32px));z-index:26;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 40px rgb(0 0 0 / .28);display:flex;flex-direction:column;overflow:hidden}
.ai-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}.ai-h b{font-family:var(--f-display)}.ai-h .code{flex:1;min-width:0}
.ai-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.ai-m{max-width:88%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45}
.ai-m.u{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:4px}
.ai-m.a{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.ai-m.a.think{color:var(--muted);font-style:italic}
.ai-card{align-self:flex-start;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:10px;padding:8px 10px;font-size:13px}
.ai-sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 14px 8px}
.ai-sugg button{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:5px 10px;font-size:12.5px}
.ai-in{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.ai-in textarea{resize:none;max-height:120px}
.fhead{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:14px 16px}.fhead label{font-size:12px;color:var(--muted);display:grid;gap:3px}
.ftab td{vertical-align:middle}.fsec td{background:var(--accent-soft);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.fno td{background:var(--red)}.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-right:1px solid var(--line);background:var(--panel);padding:6px 12px;font-weight:600;font-size:12.5px}.seg button:last-child{border-right:0}
.seg button.on.yes{background:var(--green);color:var(--green-ink)}.seg button.on.no{background:var(--red-ink);color:#fff}.seg button.on.na{background:var(--grey);color:var(--grey-ink)}
.sheet td{padding:4px 6px}.sheet input,.sheet select,.sheet textarea{padding:6px 7px;font-size:13.5px}.sheet textarea{resize:vertical;min-height:36px}
.calc{font-variant-numeric:tabular-nums;font-weight:600;display:block;padding:6px 4px}.ftotrow td{background:var(--bg)}
.ftot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}.ftot b{margin-right:10px}
.cams{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.cam{overflow:hidden}.cam-view{position:relative;aspect-ratio:16/9;max-width:100%;background:#0d1512;display:grid;place-items:center}
.cam-view img,.cam-video{width:100%;height:100%;object-fit:cover;display:block}
.cam-off{display:grid;justify-items:center;gap:6px;color:#9fb3aa;font-size:13px;text-align:center;padding:10px}.cam-off svg.i{width:32px;height:32px}
.cam-st{position:absolute;top:8px;left:8px}.cam-b{padding:12px 14px;display:grid;gap:8px}
.drop-imp{display:flex;gap:10px;align-items:center;border:1.5px dashed var(--line);border-radius:10px;padding:14px;cursor:pointer;color:var(--ink)!important}
.drop-imp:hover{border-color:var(--accent);background:var(--accent-soft)}
.imp-map{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.locbox{display:grid;gap:8px}
.loc-tools{display:flex;gap:6px;flex-wrap:wrap}.loc-tools input{flex:1;min-width:160px}
.mappick{height:260px;border-radius:10px;border:1px solid var(--line);overflow:hidden;background:var(--grey)}
.locshow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pin-ic span{display:block;width:26px;height:26px;border-radius:50% 50% 50% 0;background:var(--red-ink);transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px rgb(0 0 0 / .4)}
.siteloc{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 16px}
.checks{display:grid;gap:6px;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.checks label{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}
.checks input{width:auto}
.req::after{content:" *";color:var(--red-ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:500;z-index:40;max-width:calc(100% - 32px)}
.note{font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:flex-start}
.note svg.i{color:var(--accent);margin-top:2px}

.gantt{min-width:760px;position:relative}
.pl-scope{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;padding:12px 16px}
.pl-chk{display:flex;gap:8px;align-items:center;font-size:13px;padding:3px 0}.pl-chk input{width:auto}
.pl-warn{display:grid;gap:6px;padding:12px 16px}.pl-w{display:flex;gap:8px;align-items:flex-start;font-size:13px;border-radius:8px;padding:8px 12px}
.pl-w.high{background:var(--red);color:var(--red-ink)}.pl-w.med{background:var(--amber);color:var(--amber-ink)}.pl-w.low{background:var(--blue);color:var(--blue-ink)}.pl-w svg{flex:none;width:16px;height:16px;margin-top:2px}
.pl-tbl td{vertical-align:top}.pl-tbl input{font-size:13px;padding:6px 8px}.pl-off td{opacity:.45}.pl-off td:first-child{opacity:1}
.pl-rain{position:absolute;top:0;bottom:0;background:rgba(56,132,220,.08);pointer-events:none}.pl-rain.hv{background:rgba(56,132,220,.17)}
.pl-hol{position:absolute;top:0;bottom:0;width:2px;background:rgba(220,120,40,.45);pointer-events:none}
.g-bar.pl-wet{border-color:#3884dc;background:rgba(56,132,220,.22)}
.pl-key{display:inline-block;width:12px;height:10px;border-radius:2px;vertical-align:middle;margin:0 3px 0 10px}.pl-key.rain{background:rgba(56,132,220,.12)}.pl-key.hv{background:rgba(56,132,220,.3)}.pl-key.hol{background:rgba(220,120,40,.6);width:3px}
.pl-months{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding:14px 16px}.pl-mon{border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.pl-mh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px}.pl-mon ul{margin:6px 0 0;padding-left:18px;font-size:13px}.pl-mon li{margin:3px 0}
.pl-cm{border-left:3px solid var(--accent);padding:6px 10px;margin:8px 0;background:var(--bg);border-radius:4px}
.g-cm{font-size:12px;margin-left:6px}
.g-row{display:grid;grid-template-columns:240px 1fr;align-items:center;border-bottom:1px solid var(--line);min-height:46px}
.g-lab{padding:6px 14px;min-width:0}.g-lab b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.g-lab span{font-size:12px;color:var(--muted)}
.g-track{position:relative;height:100%;min-height:46px;margin-right:14px}
.g-bar{position:absolute;top:50%;transform:translateY(-50%);height:16px;border-radius:4px;background:var(--accent-soft);border:1px solid var(--accent);overflow:hidden;z-index:1}
.g-bar i{display:block;height:100%;background:var(--accent)}
.g-bar.late{border-color:var(--red-ink);background:var(--red)}.g-bar.late i{background:var(--red-ink)}
.g-head{min-height:30px;background:var(--bg)}.g-head .g-track{min-height:30px}
.g-tick{position:absolute;top:6px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.g-today{position:absolute;top:0;bottom:0;border-left:2px dashed var(--amber-ink)}
.g-today em{position:absolute;top:6px;left:4px;font-size:11px;font-style:normal;color:var(--amber-ink);font-weight:600}

/* ================= Web mode (outside Claude, e.g. Netlify): browser-only store ================= */
function localDb(){
  let store;try{store=JSON.parse(localStorage.getItem('bm-local')||'null');}catch(e){}
  if(!store){store=demoData();}
  COLS.forEach(c=>store[c]=store[c]||[]);
  const ls={};const save=()=>{try{localStorage.setItem('bm-local',JSON.stringify(store));}catch(e){toast('Browser storage is full.');}};
  const snap=c=>({docs:store[c].map(r=>{const{id,...rest}=r;return {id,exists:true,data:()=>rest};}),metadata:{fromCache:false,hasPendingWrites:false}});
  const emit=c=>(ls[c]||[]).forEach(f=>f(snap(c)));
  const docRef=(c,id)=>({get:async()=>{const r=store[c].find(x=>x.id===id);return {id,exists:!!r,data:()=>r?(({id,...rest})=>rest)(r):undefined};},
    set:async o=>{const i=store[c].findIndex(x=>x.id===id);const v={id,...o};if(i>=0)store[c][i]=v;else store[c].push(v);save();emit(c);},
    update:async o=>{const r=store[c].find(x=>x.id===id);if(!r)throw {code:'invalid_argument'};Object.assign(r,o);save();emit(c);},
    delete:async()=>{store[c]=store[c].filter(x=>x.id!==id);save();emit(c);}});
  return {
    doc:path=>{const[c,id]=path.split('/');return docRef(c,id);},
    collection:c=>({doc:id=>docRef(c,id||'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6)),
      add:async o=>{const id='l'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);store[c].push({id,...o});save();emit(c);return {id};},
      onSnapshot:next=>{(ls[c]=ls[c]||[]).push(next);setTimeout(()=>next(snap(c)),0);return()=>{};}}),
    reset:()=>{try{localStorage.removeItem('bm-local');}catch(e){}location.reload();}
  };
}
async function saveFile(filename,blob){
  const dl=window.claude&&claude.use?await claude.use('downloads'):null;
  if(dl){try{await dl.save({filename,data:blob});}catch(_){}return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},1000);
}

async function write(fn,ok){
  if(S.demo){toast('This is demo data — exit the demo to add or change real entries.');return false;}
  try{await fn();if(ok)toast(ok);return true;}
  catch(e){
    if(e&&e.code==='invalid_argument'){CANW=CANW0=false;toast('You can view but not change data. Ask the admin for Contributor access.');render();}
    else if(e&&e.code==='quota_exceeded')toast('Storage is full. Remove old entries first.');
    else toast('Could not save. Check your connection and try again.');
    return false;
  }
}

const STATUS_PILL={'Completed':'p-green','In progress':'p-blue','Not started':'p-grey','On hold':'p-amber','Open':'p-red','Resolved':'p-green','High':'p-red','Medium':'p-amber','Low':'p-grey',
  'Pending':'p-amber','Approved':'p-blue','Delivered':'p-green','Rejected':'p-grey','Present':'p-green','Snag (quality defect)':'p-amber','Online':'p-green','Offline':'p-red','Not installed yet':'p-grey','Yes':'p-green','No':'p-grey','Safety':'p-red','Won':'p-green','Lost':'p-grey','New':'p-blue','Quotation sent':'p-amber','Negotiation':'p-amber','Site visit':'p-blue','Requested':'p-amber','For approval':'p-amber','Superseded':'p-grey','Draft':'p-grey','Unpaid':'p-red','Part paid':'p-amber','Paid':'p-green','Half day':'p-amber','Absent':'p-red','Received from client':'p-green'};
function cell(f,r){
  const v=r[f.k];
  switch(f.t){
    case 'project':return esc(pname(v));
    case 'member':return esc(nm(v));
    case 'lead':{const l=D.leads.find(x=>x.id===v);return l?esc(l.name):'—';}
    case 'campaign':{const c=D.campaigns.find(x=>x.id===v);return c?esc(c.name):'—';}
    case 'vendor':return esc(vname(v));
    case 'labour':return esc(lname(v));
    case 'client':return esc(cname(v));
    case 'tplmulti':return (v||[]).length?(()=>{const miss=gateMissing(r);return `<span class="pill ${miss.length?'p-amber':'p-green'}" title="${esc((v||[]).map(tplName).join(', '))}">${miss.length?`🔒 ${v.length-miss.length}/${v.length} approved`:`✓ ${v.length} approved`}</span>`;})():'—';
    case 'task':{const t=D.tasks.find(x=>x.id===v);return t?esc(t.title):'—';}
    case 'projects':return (v||[]).includes('all')?'<span class="pill p-green">All projects</span>':(v||[]).length?(v||[]).map(id=>`<span class="pill p-grey" style="margin:1px">${esc(pname(id))}</span>`).join(' '):'—';
    case 'equipment':return esc(ename(v));
    case 'url':return v?`<a class="btn sm" href="${esc(v)}" target="_blank" rel="noopener noreferrer">${ico('external-link')}Open link</a>`:'—';
    case 'files':return (v||[]).length?`<div class="acts-f" style="display:flex;gap:6px;flex-wrap:wrap">${v.map(x=>`<span class="dl-f"><a class="btn sm" href="/_blob/${esc(x.id)}" target="_blank" rel="noopener" aria-label="${esc(x.name)}">${ico(fileIco(x))}${esc(x.name.length>22?x.name.slice(0,20)+'…':x.name)}</a><button type="button" class="btn sm ghost" data-fshare="${esc(x.id)}|${esc(x.name)}|${esc(x.type||'')}|${esc(r.title||x.name)}" aria-label="Share ${esc(x.name)}">${ico('share-2')}</button></span>`).join('')}</div>`:'—';
    case 'date':return fd(v);
    case 'money':return v?inr(v):'—';
    case 'number':return f.k==='progress'?`<div style="display:flex;gap:8px;align-items:center"><div class="prog"><i style="width:${Math.min(100,+v||0)}%"></i></div><span class="code">${+v||0}%</span></div>`:(v===''||v==null?'—':num(v));
    case 'photos':return (v||[]).length?`<div class="thumbs">${v.slice(0,3).map(id=>`<a href="/_blob/${esc(id)}" target="_blank" rel="noopener"><img src="/_blob/${esc(id)}" alt="" loading="lazy"></a>`).join('')}${v.length>3?`<span class="code">+${v.length-3}</span>`:''}</div>`:'—';
    case 'select':return v?(STATUS_PILL[v]?`<span class="pill ${STATUS_PILL[v]}">${esc(v)}</span>`:esc(v)):'—';
    case 'textarea':return v?esc(String(v).length>90?String(v).slice(0,90)+'…':v):'—';
    default:return esc(v||'—');
  }
}

/* ================= Inventory (computed) ================= */
function stock(){
  const map={};
  const key=r=>`${r.project}|${(r.material||'').trim().toLowerCase()}|${r.unit||''}`;
  const add=(r,field,sign)=>{if(!r.material)return;const k=key(r);map[k]=map[k]||{project:r.project,material:r.material.trim(),unit:r.unit||'',received:0,issued:0,returned:0,consumed:0,tin:0,tout:0};map[k][field]+=sign*(+r.qty||0);};
  D.received.forEach(r=>add(r,'received',1));
  D.issue.forEach(r=>add(r,'issued',1));
  D.returned.forEach(r=>add(r,'returned',1));
  D.consumed.forEach(r=>add(r,'consumed',1));
  D.requests.filter(r=>r.kind==='Transfer between sites'&&r.status==='Delivered').forEach(r=>{add(r,'tin',1);if(r.from)add({...r,project:r.from},'tout',1);});
  return Object.values(map).map(s=>({...s,store:s.received+s.tin-s.tout-s.issued+s.returned}));
}

  const rows=stock().filter(inProj).sort((a,b)=>a.material.localeCompare(b.material));

/* ================= Reports & export ================= */
function vReports(){
  const ps=S.proj==='all'?PJ():PJ().filter(p=>p.id===S.proj);
  const rows=ps.map(p=>{
    const pay=D.payments.filter(x=>x.project===p.id);
    const inA=pay.filter(x=>x.dir==='Received from client').reduce((s,x)=>s+(+x.amount||0),0);
    const outA=pay.filter(x=>x.dir!=='Received from client').reduce((s,x)=>s+(+x.amount||0),0);
    const matCost=D.received.filter(x=>x.project===p.id).reduce((s,x)=>s+(+x.qty||0)*(+x.rate||0),0);
    const mdays=D.attendance.filter(a=>a.project===p.id).reduce((s,a)=>s+(a.status==='Present'?1:a.status==='Half day'?.5:0),0)+D.vlabour.filter(v=>v.project===p.id).reduce((s,v)=>s+(+v.count||0),0);
    const ts=D.tasks.filter(t=>t.project===p.id),pc=ts.length?Math.round(ts.reduce((s,t)=>s+(t.status==='Completed'?100:+t.progress||0),0)/ts.length):0;
    const boqV=D.boq.filter(x=>x.project===p.id).reduce((s,x)=>s+(+x.qty||0)*(+x.rate||0),0);
    const boqDone=D.boq.filter(x=>x.project===p.id).reduce((s,x)=>s+(+x.done||0)*(+x.rate||0),0);
    const coV=D.changes.filter(x=>x.project===p.id&&x.status==='Approved').reduce((s,x)=>s+(+x.amount||0),0);
    const value=n(p.value)+coV,area=n(p.area);const poOpen=D.po.filter(x=>x.project===p.id&&['Draft','Sent','Partly received'].includes(x.status)).reduce((s,x)=>s+n(x.qty)*n(x.rate),0);
    return {p,inA,outA,matCost,mdays,pc,boqV,boqDone,coV,value,area,cps:area?outA/area:0,profit:value?value-outA-poOpen:0,open:D.issues.filter(i=>i.project===p.id&&i.status!=='Resolved').length,dprs:D.dpr.filter(d=>d.project===p.id).length};
  });
  const cf=cashFlow();const rh=rateHistory().sort((a,b)=>b.jump-a.jump);
  const moneyBox=`<div class="box"><div class="box-h">${ico('indian-rupee')}<h2>Cost & profit per project</h2></div>${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Project</th><th class="num">Contract value (incl. changes)</th><th class="num">Built-up area</th><th class="num">Spent so far</th><th class="num">Cost per sq.ft</th><th class="num">Received</th><th class="num">Projected profit</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${esc(pname(r.p.id))}</b></td><td class="num">${r.value?inr(r.value):'<span class="code">add in project</span>'}</td><td class="num">${r.area?num(r.area)+' sft':'—'}</td><td class="num">${inr(r.outA)}</td><td class="num">${r.cps?inr(r.cps):'—'}</td><td class="num">${inr(r.inA)}</td><td class="num">${r.value?`<b style="color:${r.profit<0?'var(--red-ink)':'var(--green-ink)'}">${inr(r.profit)}</b> <span class="code">${Math.round(r.profit/r.value*100)}%</span>`:'—'}</td></tr>`).join('')}</tbody></table></div><div class="code" style="padding:8px 16px">Projected profit = contract value + approved changes − paid out − open purchase orders. Add contract value and area when editing a project.</div>`:'<div class="empty">No projects.</div>'}</div>
  <div class="box"><div class="box-h">${ico('trending-up')}<h2>Cash flow forecast</h2></div><div class="tbl-wrap"><table><thead><tr><th></th><th class="num">Next 30 days</th><th class="num">Next 60 days</th><th class="num">Next 90 days</th></tr></thead><tbody>
    ${[['Unpaid invoices (to receive)','invIn',1],['Payment stages coming due (incl. GST)','msIn',1],['Open purchase orders (to pay)','poOut',-1],['Labour at current rate (to pay)','labOut',-1]].map(([l,k,sg])=>`<tr><td>${l}</td>${[30,60,90].map(w=>`<td class="num" style="color:${sg<0?'var(--red-ink)':'inherit'}">${sg<0?'−':''}${inr(cf[w][k])}</td>`).join('')}</tr>`).join('')}
    <tr><td><b>Net cash position</b></td>${[30,60,90].map(w=>`<td class="num"><b style="color:${cf[w].net<0?'var(--red-ink)':'var(--green-ink)'}">${inr(cf[w].net)}</b></td>`).join('')}</tr></tbody></table></div></div>
  <div class="box"><div class="box-h">${ico('package')}<h2>Material rate history</h2></div>${rh.length?`<div class="tbl-wrap"><table><thead><tr><th>Material</th><th>Unit</th><th class="num">Latest</th><th class="num">Average</th><th class="num">Lowest</th><th class="num">Highest</th><th class="num">Change vs avg</th><th>Last bought</th></tr></thead><tbody>${rh.map(r=>`<tr><td><b>${esc(r.material)}</b></td><td>${esc(r.unit)}</td><td class="num">${inr(r.last)}</td><td class="num">${inr(r.avg)}</td><td class="num">${inr(r.min)}</td><td class="num">${inr(r.max)}</td><td class="num"><span class="pill ${r.jump>=10?'p-red':r.jump<=-5?'p-green':'p-grey'}">${r.jump>0?'+':''}${r.jump}%</span></td><td class="code">${fd(r.lastDate)} · ${esc(r.lastVendor)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Record material received with a rate to see price trends.</div>'}</div>`;
  const exp=Object.keys(MOD).map(k=>`<button class="btn sm" data-export="${k}">${ico('download')}${esc(MOD[k].label)}</button>`).join('');
  return header(label('reports'))+`
  <div class="box"><div class="box-h">${ico('file-bar-chart')}<h2>Project summary</h2></div>
  ${rows.length?`<div class="tbl-wrap"><table><thead><tr><th>Project</th><th>Progress</th><th class="num">Open issues</th><th class="num">DPRs</th><th class="num">BOQ value</th><th class="num">Work done (₹)</th><th class="num">Approved changes</th><th class="num">Man-days</th><th class="num">Material value</th><th class="num">Received</th><th class="num">Paid out</th><th class="num">Balance</th></tr></thead>
  <tbody>${rows.map(r=>`<tr><td><b>${esc(pname(r.p.id))}</b></td><td>${cell({k:'progress',t:'number'},{progress:r.pc})}</td><td class="num">${r.open}</td><td class="num">${r.dprs}</td><td class="num">${inr(r.boqV)}</td><td class="num">${inr(r.boqDone)}</td><td class="num">${inr(r.coV)}</td><td class="num">${num(r.mdays)}</td><td class="num">${inr(r.matCost)}</td><td class="num">${inr(r.inA)}</td><td class="num">${inr(r.outA)}</td><td class="num"><b style="color:${r.inA-r.outA<0?'var(--red-ink)':'inherit'}">${inr(r.inA-r.outA)}</b></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Create a project to see its summary.</div>`}</div>
  ${canMoney()?moneyBox:''}
  <div class="box"><div class="box-h">${ico('download')}<h2>Export to Excel (CSV)</h2></div><div style="padding:14px 16px;display:flex;gap:8px;flex-wrap:wrap">${exp}<button class="btn sm" data-export="inventory">${ico('download')}Inventory</button><button class="btn sm" data-export="wages">${ico('download')}Wages (selected month)</button><button class="btn sm" data-export="balances">${ico('download')}Party balances</button></div>
  <div class="code" style="padding:0 16px 14px">Exports follow the project selected at the top. CSV files open in Excel and Google Sheets.</div></div>`;
}

const DRAFT={photos:{}};
function fieldInput(f,v){
  const id='f-'+f.k,req=f.req?'required':'';
  const sel=(opts,val)=>`<select id="${id}" ${req}><option value="">—</option>${opts.map(([k,l])=>`<option value="${esc(k)}" ${String(val)===String(k)?'selected':''}>${esc(l)}</option>`).join('')}</select>`;
  switch(f.t){
    case 'textarea':return `<textarea id="${id}" rows="3" ${req}>${esc(v||'')}</textarea>`;
    case 'number':case 'money':return `<input id="${id}" type="number" step="any" ${f.neg?'':'min="0"'} ${f.max?`max="${f.max}"`:''} inputmode="decimal" value="${esc(v??'')}" ${req}>`;
    case 'date':return `<input id="${id}" type="date" value="${esc(v||(f.def==='today'?today():''))}" ${req}>`;
    case 'select':return sel(f.o.map(o=>[o,o]),v??(f.o[0]&&f.k==='status'?f.o[0]:''));
    case 'project':return sel(PJ().map(p=>[p.id,pname(p.id)]),v??(S.proj!=='all'&&f.k==='project'?S.proj:''));
    case 'member':return sel(D.members.map(m=>[m.id,nm(m.id)]),v);
    case 'vendor':return sel(D.vendors.map(x=>[x.id,x.name]),v);
    case 'lead':return sel(D.leads.map(x=>[x.id,`${x.name}${x.phone?' · '+x.phone:''}`]),v);
    case 'campaign':return sel(D.campaigns.map(x=>[x.id,`${x.name}${x.channel?' · '+x.channel:''}`]),v);
    case 'labour':return sel(D.labour.map(x=>[x.id,`${x.name}${x.trade?' · '+x.trade:''}`]),v);
    case 'client':return sel(D.clients.map(x=>[x.id,x.name]),v);
    case 'tplmulti':return `<div id="${id}" class="checks">${CHECKLISTS.map(t=>`<label><input type="checkbox" value="${t.id}" ${(v||[]).includes(t.id)?'checked':''}>${esc(t.title.replace(/^Checklist for /,''))}</label>`).join('')}</div>`;

    case 'location':{const L=DRAFT.loc;
      return `<div class="locbox">

        <div id="mapPick" class="mappick"><div class="code" style="padding:12px">Loading map…</div></div>
        <div class="code">Tap the map or drag the pin to the exact plot. The address below fills in automatically.</div>`
        :`<div class="code">Open <a href="https://www.google.com/maps" target="_blank" rel="noopener noreferrer">Google Maps</a> or <a href="https://maps.apple.com/" target="_blank" rel="noopener noreferrer">Apple Maps</a>, drop a pin on the plot, copy the link or the coordinates, and paste it here.</div>`}
        <div class="loc-tools"><input id="locPaste" placeholder="Paste Google/Apple Maps link or 17.4483, 78.3915" aria-label="Paste map link or coordinates"><button type="button" class="btn sm" id="locUse">${ico('map-pin')}Use</button></div>
        <div id="locShow" class="locshow">${locShow(L)}</div></div>`;}

/* ================= Activity schedule (timeline) ================= */
function vSchedule(){
  const wbsKey=w=>String(w||'').split(/[.\-]/).map(x=>String(x).padStart(5,'0')).join('.');
  const ts=D.tasks.filter(t=>inProj(t)&&(t.start||t.due)).map(t=>({...t,s:t.start||t.due,e:t.due||t.start})).sort((a,b)=>(a.wbs&&b.wbs&&a.project===b.project)?wbsKey(a.wbs).localeCompare(wbsKey(b.wbs)):a.s.localeCompare(b.s));
  const ed=CANW&&canEditView('tasks');const btn=CANW?`${isAdmin()?`<button class="btn" id="schedGen">${ico('gantt-chart')}Generate work schedule</button>`:''}${ed&&D.tasks.some(t=>inProj(t)&&(t.start||t.due))?`<button class="btn ${S.schedTable?'pri':''}" id="schedTbl">${ico('pencil')}${S.schedTable?'Show timeline':'Edit as table'}</button><button class="btn" id="schedShift">${ico('arrow-left-right')}Shift schedule</button>`:''}${canView('documents')?`<button class="btn" data-go="drawlib">${ico('library')}Drawings library</button>`:''}<button class="btn" data-import="1">${ico('file-up')}Import schedule</button><button class="btn pri" data-add="tasks">${ico('plus')}Add activity</button>`:'';
  if(!ts.length)return header(label('schedule'),btn)+`<div class="box hero-empty">${ico('gantt-chart')}<h2>No scheduled activities</h2><p>Add tasks with a start and due date (for example "Footing excavation", "GF slab casting"). They appear here as a timeline with progress against today.</p>${btn}</div>`;
  const day=s=>new Date(s+'T00:00').getTime()/864e5;
  let min=Math.min(...ts.map(t=>day(t.s)),day(today()))-2,max=Math.max(...ts.map(t=>day(t.e)),day(today()))+3;
  const span=max-min,pos=d=>((d-min)/span*100).toFixed(2)+'%';
  const ticks=[];const st=new Date(min*864e5);st.setDate(1);
  for(let d=new Date(st);d.getTime()/864e5<=max;d.setMonth(d.getMonth()+1)){const v=d.getTime()/864e5;if(v>=min)ticks.push([v,d.toLocaleDateString(LOC(),{month:'short',year:'2-digit'})]);}
  if(span<75){ticks.length=0;for(let v=Math.ceil(min);v<=max;v+=7)ticks.push([v,new Date(v*864e5).toLocaleDateString(LOC(),{day:'numeric',month:'short'})]);}
  const tdy=day(today());
  if(S.schedTable&&ed)return header(label('schedule'),btn)+schedTable(ts);
  const rows=ts.map(t=>{const done=t.status==='Completed'?100:+t.progress||0;const late=t.status!=='Completed'&&t.e<today();
    const w=Math.max(.8,(day(t.e)-day(t.s)+1)/span*100);
    return `<div class="g-row"><div class="g-lab"><b>${t.wbs?`<span class="code">${esc(t.wbs)}</span> `:''}${esc(t.title)}${(t.gates||[]).length?(gateMissing(t).length?` <span title="Needs approved: ${esc(gateMissing(t).join(', '))}">🔒</span>`:' <span title="Checklists approved">✅</span>'):''}</b><span>${esc(S.proj==='all'?pname(t.project):nm(t.who))} · ${fd(t.s)} → ${fd(t.e)} <button type="button" class="linkish g-cm" data-tcm="${esc(t.id)}" title="Comments">💬${(t.comments||[]).length?' '+(t.comments||[]).length:''}</button>${ed?`<button type="button" class="linkish g-cm" data-sedit="${esc(t.id)}" title="Edit activity" aria-label="Edit ${esc(t.title)}">✎ Edit</button>`:''}</span></div>
      <div class="g-track"${ed?` data-sedit="${esc(t.id)}" style="cursor:pointer" title="Tap to edit"`:''}><div class="g-bar ${late?'late':''}" style="left:${pos(day(t.s))};width:${w.toFixed(2)}%" title="${esc(t.title)} · ${done}%"><i style="width:${done}%"></i></div></div></div>`;}).join('');
  const late=ts.filter(t=>t.status!=='Completed'&&t.e<today()).length;
  const planned=ts.filter(t=>t.e<=today()).length,doneN=ts.filter(t=>t.status==='Completed').length;
  return header(label('schedule'),btn)+`<div class="box tiles"><div class="tile"><b>${ts.length}</b><span>Activities</span></div><div class="tile"><b>${doneN}</b><span>Completed</span></div><div class="tile"><b>${planned}</b><span>Should be done by today</span></div><div class="tile"><b style="color:${late?'var(--red-ink)':'inherit'}">${late}</b><span>Behind schedule</span></div></div>
  <div class="box"><div class="tbl-wrap"><div class="gantt">
    <div class="g-row g-head"><div class="g-lab"></div><div class="g-track">${ticks.map(([v,l])=>`<span class="g-tick" style="left:${pos(v)}">${l}</span>`).join('')}<span class="g-today" style="left:${pos(tdy)}"><em>Today</em></span></div></div>
    ${rows}<div class="g-row g-foot"><div class="g-lab"></div><div class="g-track">${ticks.map(([v])=>`<span class="g-line" style="left:${pos(v)}"></span>`).join('')}<span class="g-today" style="left:${pos(tdy)}"></span></div></div>
  </div></div><div class="code" style="padding:10px 16px">Bar = planned start to due date · dark fill = progress · red = past due and not complete.</div></div>`;
}

function wagesRows(){

/* ================= Party balances ================= */
function balanceRows(){
  const vend=D.vendors.map(v=>{
    const mat=D.received.filter(r=>inProj(r)&&r.vendor===v.id).reduce((s,r)=>s+(+r.qty||0)*(+r.rate||0),0);
    const lab=D.vlabour.filter(r=>inProj(r)&&r.vendor===v.id).reduce((s,r)=>s+(+r.count||0)*(+r.rate||0),0);
    const eq=D.equiplog.filter(r=>inProj(r)&&(D.equipment.find(e=>e.id===r.equip)||{}).vendor===v.id).reduce((s,r)=>s+equipCost(r),0);
    const paid=D.payments.filter(p=>inProj(p)&&p.vendor===v.id).reduce((s,p)=>s+(+p.amount||0),0);
    return {name:v.name,kind:'Vendor',billed:mat+lab+eq,paid,bal:mat+lab+eq-paid};}).filter(r=>r.billed||r.paid);
  const cli=D.clients.map(c=>{
    const billed=D.invoices.filter(i=>inProj(i)&&i.client===c.id&&(i.kind==='Tax invoice'||i.kind==='RA bill')).reduce((s,i)=>s+invTotal(i),0);
    const paid=D.payments.filter(p=>inProj(p)&&p.client===c.id&&p.dir==='Received from client').reduce((s,p)=>s+(+p.amount||0),0);
    return {name:c.name,kind:'Client',billed,paid,bal:billed-paid};}).filter(r=>r.billed||r.paid);
  return {vend,cli};
}

/* ================= Budget vs actual ================= */
function vBudgetVA(){
  const b=D.budget.filter(inProj),pay=D.payments.filter(p=>inProj(p)&&p.dir!=='Received from client');
  const rows=CATS.map(c=>({c,bud:b.filter(x=>x.cat===c).reduce((s,x)=>s+(+x.amount||0),0),act:pay.filter(x=>(x.cat||'Other')===c).reduce((s,x)=>s+(+x.amount||0),0)})).filter(r=>r.bud||r.act);
  const tb=rows.reduce((s,r)=>s+r.bud,0),ta=rows.reduce((s,r)=>s+r.act,0);
  return header(label('budgetva'),CANW?`<button class="btn pri" data-add="budget">${ico('plus')}Budget line</button>`:'')+
  (rows.length?`<div class="box tiles"><div class="tile"><b>${inr(tb)}</b><span>Budget</span></div><div class="tile"><b>${inr(ta)}</b><span>Spent</span></div><div class="tile"><b style="color:${tb-ta<0?'var(--red-ink)':'inherit'}">${inr(tb-ta)}</b><span>${tb-ta<0?'Over budget':'Remaining'}</span></div></div>
  <div class="box"><div class="tbl-wrap"><table><thead><tr><th>Category</th><th class="num">Budget</th><th class="num">Spent</th><th>Used</th><th class="num">Remaining</th></tr></thead><tbody>${rows.map(r=>{const pc=r.bud?Math.round(r.act/r.bud*100):100;return `<tr><td><b>${esc(r.c)}</b></td><td class="num">${inr(r.bud)}</td><td class="num">${inr(r.act)}</td>
    <td><div style="display:flex;gap:8px;align-items:center"><div class="prog" style="flex:1"><i style="width:${Math.min(100,pc)}%;${pc>100?'background:var(--red-ink)':''}"></i></div><span class="code">${pc}%</span></div></td>
    <td class="num"><b style="color:${r.bud-r.act<0?'var(--red-ink)':'inherit'}">${inr(r.bud-r.act)}</b></td></tr>`;}).join('')}</tbody></table></div></div>
  <div class="code">Spent = payments out, by the cost category chosen on each payment.</div>`
  :`<div class="box hero-empty">${ico('wallet')}<h2>No budget yet</h2><p>Add budget lines per category (Material, Labour, Sub-contract…). Choose a cost category on each payment and the comparison appears here.</p>${CANW?`<button class="btn pri" data-add="budget">${ico('plus')}Add budget line</button>`:''}</div>`);
}

/* ================= Site location (maps) ================= */
function parseLoc(str){
  str=String(str||'').trim();if(!str)return null;
  const pats=[/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/,/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/,/[?&](?:q|query|ll|destination|daddr|sll|coordinate)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i,/^(-?\d{1,2}\.\d+)\s*[, ]\s*(-?\d{1,3}\.\d+)$/];
  for(const re of pats){const m=str.match(re);if(m){const lat=+m[1],lng=+m[2];if(Math.abs(lat)<=90&&Math.abs(lng)<=180)return {lat:+lat.toFixed(6),lng:+lng.toFixed(6)};}}
  return null;
}
const gmaps=l=>`https://www.google.com/maps/search/?api=1&query=${l.lat},${l.lng}`;
const gdir=l=>`https://www.google.com/maps/dir/?api=1&destination=${l.lat},${l.lng}`;
const amaps=l=>`https://maps.apple.com/?ll=${l.lat},${l.lng}&q=Site`;
const adir=l=>`https://maps.apple.com/?daddr=${l.lat},${l.lng}`;
function mapButtons(l,dir){if(!l)return '';return `<a class="btn sm" href="${esc(dir?gdir(l):gmaps(l))}" target="_blank" rel="noopener noreferrer">${ico('map')}Google Maps</a><a class="btn sm" href="${esc(dir?adir(l):amaps(l))}" target="_blank" rel="noopener noreferrer">${ico('navigation')}Apple Maps</a>`;}
function locShow(l){return l?`<span class="pill p-green">${ico('map-pin')} ${l.lat.toFixed(5)}, ${l.lng.toFixed(5)}</span> ${mapButtons(l)} <button type="button" class="btn sm ghost warn" id="locClear">${ico('x')}Remove pin</button>`:'<span class="code">No pin yet.</span>';}
let MAP=null,PIN=null;
function loadLeaflet(){
  if(window.L&&L.map)return Promise.resolve();
  return new Promise((ok,bad)=>{
    const css=document.createElement('link');css.rel='stylesheet';css.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';document.head.appendChild(css);
    const js=document.createElement('script');js.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';js.onload=ok;js.onerror=bad;document.head.appendChild(js);
  });
}
async function initMap(){
  const box=document.getElementById('mapPick');if(!box)return;
  try{await loadLeaflet();}catch(e){box.innerHTML='<div class="code" style="padding:12px">Map could not load. Paste a map link below instead.</div>';return;}
  if(!document.getElementById('mapPick'))return;
  box.innerHTML='';
  const start=DRAFT.loc||{lat:17.385,lng:78.4867};
  MAP=L.map(box,{zoomControl:true}).setView([start.lat,start.lng],DRAFT.loc?17:11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(MAP);
  const icon=L.divIcon({className:'pin-ic',html:'<span></span>',iconSize:[26,26],iconAnchor:[13,26]});
  PIN=null;
  const place=(lat,lng,geo)=>{if(!PIN){PIN=L.marker([lat,lng],{draggable:true,icon}).addTo(MAP);PIN.on('dragend',()=>{const p=PIN.getLatLng();setLoc(p.lat,p.lng,true);});}else PIN.setLatLng([lat,lng]);setLoc(lat,lng,geo);};
  MAP._place=place;
  if(DRAFT.loc)place(DRAFT.loc.lat,DRAFT.loc.lng,false);
  MAP.on('click',e=>place(e.latlng.lat,e.latlng.lng,true));
  setTimeout(()=>MAP&&MAP.invalidateSize(),200);
}
async function setLoc(lat,lng,geo){
  DRAFT.loc={lat:+(+lat).toFixed(6),lng:+(+lng).toFixed(6)};
  const sh=document.getElementById('locShow');if(sh){sh.innerHTML=locShow(DRAFT.loc);}
  if(geo&&S.web){
    try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&lat=${lat}&lon=${lng}`,{headers:{'Accept-Language':'en'}});
      const j=await r.json();const a=document.getElementById('f-address');
      if(j&&j.display_name&&a){a.value=j.display_name;DRAFT.loc.address=j.display_name;toast('Address filled in from the pin');}
    }catch(e){toast('Pin saved. Type the address yourself — address lookup is not reachable.');}
  }
}
async function findPlace(){
  const q=(document.getElementById('locSearch')||{}).value||'';if(!q.trim())return;
  try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=in&q=${encodeURIComponent(q)}`,{headers:{'Accept-Language':'en'}});
    const j=await r.json();if(!j.length){toast('Place not found. Try a nearby landmark or area name.');return;}
    MAP.setView([+j[0].lat,+j[0].lon],17);MAP._place(+j[0].lat,+j[0].lon,true);}
  catch(e){toast('Search is not reachable right now. Tap the map instead.');}
}

function formLevel(pid,tid){

function autoHead(label,p){
  const L=label.toLowerCase();
  if(/^project( name)?$/.test(L))return p.name||'';
  if(/client|customer/.test(L))return cname(p.client)!=='—'?cname(p.client):'';
  if(/project location|site location/.test(L))return p.address||'';
  if(L==='project id')return p.prefix||'';
  if(/site name/.test(L))return p.name||'';
  if(/^date$|updated as on|bill date/.test(L))return today();
  return '';
}

async function saveAttBulk(){
  if(S.demo){toast('Exit the demo to save real attendance.');return;}

/* ================= Auto daily report ================= */
function buildDpr(pid,date){
  const on=c=>D[c].filter(x=>x.project===pid&&x.date===date);
  const att=on('attendance'),vl=on('vlabour'),rec=on('received'),iss=on('issue'),con=on('consumed'),wu=on('workupd'),eq=on('equiplog');
  const pres=att.filter(a=>a.status==='Present').length,half=att.filter(a=>a.status==='Half day').length;
  const trades={};att.filter(a=>a.status!=='Absent').forEach(a=>{const t=(D.labour.find(l=>l.id===a.labour)||{}).trade||'Worker';trades[t]=(trades[t]||0)+(a.status==='Half day'?.5:1);});
  const L=[];
  if(wu.length){L.push('Work done:');wu.forEach(w=>L.push(`• ${w.work}${w.qty?` — ${num(w.qty)} ${w.unit||''}`:''}${w.gang?` (${w.gang})`:''}`));}
  const prog=D.tasks.filter(t=>t.project===pid&&t.status==='In progress');
  if(prog.length){L.push('Activities in progress:');prog.forEach(t=>L.push(`• ${t.title} — ${+t.progress||0}%`));}
  if(att.length||vl.length){L.push('Manpower:');if(att.length)L.push(`• Own labour: ${pres} present${half?`, ${half} half day`:''} (${Object.entries(trades).map(([t,c])=>`${t} ${c}`).join(', ')})`);vl.forEach(v=>L.push(`• ${vname(v.vendor)}: ${v.count} ${v.trade||'workers'}`));}
  if(rec.length){L.push('Material received:');rec.forEach(r=>L.push(`• ${r.material} ${num(r.qty)} ${r.unit||''}${r.vendor?` from ${vname(r.vendor)}`:''}`));}
  if(iss.length||con.length){L.push('Material used / issued:');iss.forEach(r=>L.push(`• Issued ${r.material} ${num(r.qty)} ${r.unit||''}${r.to?` to ${r.to}`:''}`));con.forEach(r=>L.push(`• Consumed ${r.material} ${num(r.qty)} ${r.unit||''}${r.work?` for ${r.work}`:''}`));}
  if(eq.length){L.push('Equipment:');eq.forEach(e=>L.push(`• ${ename(e.equip)} ${num(e.hours)} hrs${e.work?` — ${e.work}`:''}`));}
  const nd=new Date(date+'T00:00');nd.setDate(nd.getDate()+1);const tm=isoDate(nd);
  const plan=D.tasks.filter(t=>t.project===pid&&t.status!=='Completed'&&(t.start||'')<=tm&&(t.due||'9')>=tm).map(t=>`• ${t.title}`);
  const hin=[...D.issues.filter(i=>i.project===pid&&i.status!=='Resolved'&&i.severity==='High').map(i=>`• ${i.title}`),...D.requests.filter(r=>r.project===pid&&r.status==='Pending').map(r=>`• Waiting for ${r.material} (${num(r.qty)} ${r.unit||''})`)];
  const photos=[...wu.flatMap(w=>w.photos||[]),...D.issues.filter(i=>i.project===pid&&i.due===date).flatMap(i=>i.photos||[])];
  return {work:L.join('\n')||'(Nothing recorded today yet — type the work done here.)',plan:plan.join('\n'),hindrance:hin.join('\n'),photos};
}
function autoDpr(pid,date){
  const ex=D.dpr.find(d=>d.project===pid&&d.date===date);
  const b=buildDpr(pid,date);
  if(ex){toast('A report for today already exists — opening it with the latest figures added below.');openForm('dpr',ex.id);setTimeout(()=>{const w=document.getElementById('f-work');if(w&&!w.value.includes(b.work.slice(0,30)))w.value=(w.value?w.value+'\n\n':'')+b.work;},50);return;}
  openForm('dpr',null,{project:pid,date,work:b.work,plan:b.plan,hindrance:b.hindrance,photos:b.photos});
  toast('Report built from today\'s entries. Check it, add remarks and photos, then Save.');
}

/* ================= Quality gates (checklists before a task can be completed) ================= */
function gateMissing(task){
  return (task.gates||[]).filter(tid=>!D.forms.some(f=>f.project===task.project&&f.tpl===tid&&f.status==='Approved'&&(!f.task||f.task===task.id))).map(tid=>(tplById(tid)||{title:tid}).title);
}
const tplName=id=>(tplById(id)||{title:id}).title.replace(/^Checklist for /,'');

/* ================= Payment milestones ================= */
const MS_PILL={'Upcoming':'p-grey','Due':'p-amber','Invoiced':'p-blue','Paid':'p-green'};
function msAmount(m){if(n(m.amount))return n(m.amount);const p=proj(m.project);return n(m.pct)*n(p&&p.value)/100;}
function msStatus(m){
  if(m.inv){const i=D.invoices.find(x=>x.id===m.inv);if(i&&i.status==='Paid')return 'Paid';if(i)return 'Invoiced';}
  const t=D.tasks.find(x=>x.id===m.task);
  if(t&&(t.status==='Completed'))return 'Due';
  if(!m.task&&m.due&&m.due<=today())return 'Due';
  return 'Upcoming';
}
function msDueDate(m){const t=D.tasks.find(x=>x.id===m.task);return (t&&t.due)||m.due||'';}
function raiseInvoice(mid){
  const m=D.milestones.find(x=>x.id===mid);if(!m)return;const p=proj(m.project)||{};
  openForm('invoices',null,{kind:'Tax invoice',project:m.project,client:p.client||'',no:nextInvNo('Tax invoice'),date:today(),desc:`Stage payment: ${m.stage}${m.pct?` (${m.pct}% of contract value)`:''} — ${p.name||''}`,amount:msAmount(m),gst:'GST 18%',sac:orgVal('sac')||'995411',status:'Unpaid',_ms:mid});
}

function computeAlerts(){
  const t=today(),A_=[];const add=(sev,txt,view,pid)=>{if(canView(view)&&(!pid||projOK(pid)))A_.push({sev,txt,view,pid});};
  D.tasks.filter(x=>x.status!=='Completed'&&x.due&&x.due<t).forEach(x=>add('high',`Task late: ${x.title} (due ${fd(x.due)})`,'tasks',x.project));
  D.tasks.filter(x=>x.status!=='Completed'&&n(x.progress)>=100&&gateMissing(x).length).forEach(x=>add('med',`${x.title}: waiting for approved ${gateMissing(x).join(', ')}`,'forms',x.project));
  D.issues.filter(x=>x.status!=='Resolved'&&(x.severity==='High'||(x.due&&x.due<t))).forEach(x=>add('high',`${x.kind||'Issue'}: ${x.title}${x.due&&x.due<t?' — overdue':''}`,'issues',x.project));
  D.leads.filter(l=>l.follow&&l.follow<=t&&!['Won','Lost'].includes(l.stage)).forEach(l=>add('med',`Follow up lead: ${l.name} (${l.phone})`,'leads'));
  stock().filter(s=>s.received>0&&s.store<=s.received*0.1).forEach(s=>add('med',`Low stock: ${s.material} — ${num(s.store)} ${s.unit} left`,'inventory',s.project));
  if(isAdmin())pendingJoins().forEach(r=>A_.push({sev:'high',txt:`Login code sent to a new person: ${r.name||r.email}${r.role?' — '+r.role:''} (${r.email}${r.phone?', '+r.phone:''})`,view:'team'}));
  D.requests.filter(r=>r.status==='Pending').forEach(r=>add('med',`Material request pending: ${r.material} ${num(r.qty)} ${r.unit||''}${r.needBy?` by ${fd(r.needBy)}`:''}`,'requests',r.project));
  D.forms.filter(f=>f.status==='Submitted').forEach(f=>{if(isAdmin())add('med',`Checklist waiting for your approval: ${f.title}`,'forms',f.project);});
  D.documents.filter(d=>d.status==='For approval').forEach(d=>add('med',`Drawing for approval: ${d.title} ${d.rev||''}`,'documents',d.project));
  D.changes.filter(c=>c.status==='Requested').forEach(c=>add('med',`Change order ${c.no} waiting for approval (${inr(c.amount)})`,'changes',c.project));
  D.invoices.filter(i=>(i.kind==='Tax invoice'||i.kind==='RA bill')&&i.status!=='Paid'&&i.date&&(Date.now()-new Date(i.date+'T00:00'))>15*864e5).forEach(i=>add('high',`Payment overdue: ${i.no} — ${inr(invTotal(i)-n(i.got))} from ${cname(i.client)}`,'invoices',i.project));
  D.milestones.filter(m=>msStatus(m)==='Due').forEach(m=>add('high',`Stage reached — raise invoice: ${m.stage} (${inr(msAmount(m))})`,'milestones',m.project));
  D.cameras.filter(c=>c.status==='Offline'&&camAllowed(c)).forEach(c=>add('low',`Camera offline: ${c.name}`,'cctv',c.project));

  const o={high:0,med:1,low:2};return A_.sort((a,b)=>o[a.sev]-o[b.sev]);
}

/* ================= Material rate history ================= */
function rateHistory(){
  const m={};D.received.filter(r=>n(r.rate)&&r.material&&(S.proj==='all'||r.project===S.proj)).sort((a,b)=>(a.date||'').localeCompare(b.date||'')).forEach(r=>{const k=(r.material.trim().toLowerCase())+'|'+(r.unit||'');(m[k]=m[k]||{material:r.material.trim(),unit:r.unit||'',rows:[]}).rows.push(r);});
  return Object.values(m).map(x=>{const rs=x.rows.map(r=>n(r.rate));const last=rs[rs.length-1],avg=rs.reduce((s,v)=>s+v,0)/rs.length;
    return {...x,last,avg,min:Math.min(...rs),max:Math.max(...rs),count:rs.length,lastDate:x.rows[x.rows.length-1].date,lastVendor:vname(x.rows[x.rows.length-1].vendor),jump:rs.length>1?Math.round((last-avg)/avg*100):0};});
}

/* ================= Cash flow forecast ================= */
function cashFlow(){
  const t=today(),inDays=d=>{const x=new Date(t+'T00:00');x.setDate(x.getDate()+d);return isoDate(x);};
  const ps=new Set(PJ().filter(p=>S.proj==='all'||p.id===S.proj).map(p=>p.id));
  const out={};[30,60,90].forEach(w=>{
    const end=inDays(w);
    const invIn=D.invoices.filter(i=>ps.has(i.project)&&(i.kind==='Tax invoice'||i.kind==='RA bill')&&i.status!=='Paid').reduce((s,i)=>s+invTotal(i)-n(i.got),0);
    const msIn=D.milestones.filter(m=>ps.has(m.project)&&!m.inv&&msStatus(m)!=='Paid'&&(msStatus(m)==='Due'||(msDueDate(m)&&msDueDate(m)<=end))).reduce((s,m)=>s+msAmount(m)*1.18,0);
    const poOut=D.po.filter(p=>ps.has(p.project)&&['Draft','Sent','Partly received'].includes(p.status)&&(!p.delivery||p.delivery<=end)).reduce((s,p)=>s+n(p.qty)*n(p.rate),0);
    const since=inDays(-14);const lab=D.attendance.filter(a=>ps.has(a.project)&&a.date>=since&&a.date<=t).reduce((s,a)=>{const l=D.labour.find(x=>x.id===a.labour)||{};return s+(a.status==='Present'?1:a.status==='Half day'?.5:0)*n(l.wage)+n(a.ot)*n(l.wage)/8;},0)
      +D.vlabour.filter(v=>ps.has(v.project)&&v.date>=since).reduce((s,v)=>s+n(v.count)*n(v.rate),0);
    const labOut=lab/14*w;
    out[w]={invIn,msIn,poOut,labOut,net:invIn+msIn-poOut-labOut};});
  return out;
}

/* ================= GST helpers ================= */
const orgVal=k=>((D.org.find(o=>o.id==='main')||{})[k]||'');
const GSTIN_RE=/^\d{2}[A-Z]{5}\d{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;
function fyStr(d){const x=new Date((d||today())+'T00:00');const y=x.getMonth()>=3?x.getFullYear():x.getFullYear()-1;return `${y}-${String((y+1)%100).padStart(2,'0')}`;}
function nextInvNo(kind){
  const pre={'Tax invoice':orgVal('invPrefix')||'INV','Quotation':'QT','Proforma invoice':'PI','RA bill':'RA'}[kind]||'INV';
  const fy=fyStr(today());const re=new RegExp('^'+pre.replace(/[^\w]/g,'\\$&')+'/'+fy+'/(\\d+)$');
  const mx=D.invoices.reduce((m,i)=>{const r=String(i.no||'').match(re);return r?Math.max(m,+r[1]):m;},0);
  return `${pre}/${fy}/${String(mx+1).padStart(3,'0')}`;
}
function gstSplit(inv){
  const rate=GST[inv.gst]||0;const c=D.clients.find(x=>x.id===inv.client)||{};const os=orgVal('state'),cs=c.state||'';
  const inter=os&&cs&&os!==cs;const tax=n(inv.amount)*rate;
  return {rate,inter,tax,cgst:inter?0:tax/2,sgst:inter?0:tax/2,igst:inter?tax:0,pos:cs||os||''};
}

  if(S.demo||!db)return;

const PTPL={
  'G+1 house':{floors:1,days:240},'G+2 house':{floors:2,days:300},'Duplex villa':{floors:1,days:270,villa:1},'Commercial G+3':{floors:3,days:420,comm:1},
};
function tplStages(name){
  const c=PTPL[name];if(!c)return [];
  const fl=['GF','FF','SF','TF'].slice(0,c.floors+1);
  const S_=[['1','Site clearing, survey & setting out',4,['qc-sur']],['2','Footing excavation',7,['cl-exc']],['3','Anti-termite & PCC',4,['cl-att','cl-pcc']],['4','Footings & column starters',12,['cl-ren','cl-sht','cl-pre']],['5','Plinth beams & backfilling',10,['cl-con','qc-ewb']]];
  fl.slice(0,-1).forEach((f,i)=>{const nx=fl[i+1];S_.push([`${6+i*2}`,`${f} columns`,10,['cl-ren','cl-sht']],[`${7+i*2}`,`${f} roof slab & beams (${nx} floor slab)`,16,['cl-pre','cl-con']]);});
  const last=fl[fl.length-1];
  S_.push([`${6+(fl.length-1)*2}`,`${last} roof slab & headroom`,16,['cl-pre','cl-con']]);
  const base=S_.length;
  [['Brickwork / blockwork',35,['cl-msn']],['Electrical conduits & plumbing lines',20,['qc-ele','qc-wsl']],['Internal & external plastering',35,['cl-pls']],['Flooring & wall tiling',30,['cl-til']],['Doors, windows & fabrication',20,['qc-fab']],['Painting',25,['cl-pnt']],['Sanitary & electrical fixtures',12,['qc-wsl','qc-ele']],['Cleaning & handover',5,[]]].forEach((x,i)=>S_.push([String(base+1+i),...x]));
  if(c.comm)S_.splice(S_.length-1,0,[String(S_.length),'False ceiling & interiors',25,['qc-fc','qc-int']]);
  return S_;
}
const MS_STD=[['Booking / agreement',10,null],['Foundation & plinth complete',15,'Plinth'],['Roof slab',15,'roof slab'],['Brickwork complete',15,'Brickwork'],['Plastering complete',15,'plastering'],['Flooring & tiling complete',15,'Flooring'],['Handover',15,'handover']];
const BUDGET_STD=[['Material',55],['Labour',20],['Sub-contract',12],['Equipment',3],['Site expense',3],['Design & approvals',2]];
async function seedProject(pid,name,start,value){
  const st=tplStages(name);if(!st.length)return;
  let d=new Date((start||today())+'T00:00');const ids=[];
  for(const [wbs,title,dur,gates] of st){
    const s=isoDate(d);const e=new Date(d);e.setDate(e.getDate()+dur-1);
    let id=null;await write(async()=>{const r=await db.collection('tasks').add({project:pid,wbs,title,start:s,due:isoDate(e),progress:0,status:'Not started',gates,source:'Template: '+name,by:ME.id,at:Date.now()});id=r.id;});
    ids.push({id,title});d=new Date(e);d.setDate(d.getDate()+1);
  }
  const roofs=ids.filter(x=>/roof slab/i.test(x.title));
  for(const [stage,pct,match] of MS_STD){
    if(match==='roof slab'){for(const r of roofs)await write(()=>db.collection('milestones').add({project:pid,stage:r.title.replace(/ & .*/,'')+' cast',pct:Math.round(15/roofs.length*10)/10,task:r.id,by:ME.id,at:Date.now()}));continue;}
    const t=match?ids.find(x=>x.title.toLowerCase().includes(match.toLowerCase())):null;
    await write(()=>db.collection('milestones').add({project:pid,stage,pct,task:t?t.id:'',due:match?'':start||today(),by:ME.id,at:Date.now()}));
  }
  if(n(value))for(const [cat,pct] of BUDGET_STD)await write(()=>db.collection('budget').add({project:pid,cat,amount:Math.round(n(value)*pct/100),notes:`${pct}% of contract value (template)`,by:ME.id,at:Date.now()}));
  audit('created','projects',pid,`Template "${name}": ${st.length} activities, payment stages${n(value)?' and budget':''}`);
  toast(`Template added: ${st.length} activities with checklists, payment stages${n(value)?' and budget':''}`);
}

async function backupXlsx(){
  try{await loadSheetJS();}catch(e){toast('Excel tool could not load.');return;}
  const wb=XLSX.utils.book_new();
  COLS.filter(c=>c!=='audit').forEach(c=>{const rows=D[c].map(r=>{const o={};Object.entries(r).forEach(([k,v])=>{o[k]=v&&typeof v==='object'?JSON.stringify(v):v;});return o;});
    if(rows.length)XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),c.slice(0,31));});
  if(!wb.SheetNames.length){toast('Nothing to back up yet.');return;}
  const buf=XLSX.write(wb,{type:'array',bookType:'xlsx'});
  await saveFile(`BuildMitr-backup-${today()}.xlsx`,new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
}
async function backupJson(){
  const data={app:'BuildMitr',version:1,at:new Date().toISOString(),collections:{}};COLS.forEach(c=>data.collections[c]=D[c]);
  await saveFile(`BuildMitr-backup-${today()}.json`,new Blob([JSON.stringify(data)],{type:'application/json'}));
}
async function restoreJson(file){
  if(S.demo){toast('Exit the demo before restoring.');return;}
  let data;try{data=JSON.parse(await file.text());}catch(e){toast('This is not a BuildMitr backup file.');return;}
  if(!data||data.app!=='BuildMitr'||!data.collections){toast('This is not a BuildMitr backup file.');return;}
  let added=0,skipped=0;
  for(const [c,rows] of Object.entries(data.collections)){
    if(!COLS.includes(c)||c==='audit'||c==='members')continue;
    for(const r of rows||[]){
      if(!r||!r.id||D[c].some(x=>x.id===r.id)){skipped++;continue;}
      const {id,...rest}=r;const ok=await write(()=>db.doc(c+'/'+id).set(rest));if(!ok){toast(`Restore stopped after ${added} records.`);return;}added++;
    }
  }
  audit('restored','backup','',`${added} records restored from ${file.name}`);
  toast(`Restored ${added} records${skipped?` (${skipped} already existed, kept as they are)`:''}`);
}

/* ---- follow-ups (sequence) ---- */
function followQueue(){
  const t=today();const out=[];
  D.leads.filter(l=>!['Won','Lost'].includes(l.stage||'New')).forEach(l=>{
    if((l.stage||'New')==='New'){out.push({l,kind:'First reply',due:isoDate(new Date(l.at||Date.now())),why:'New enquiry — reply first'});return;}
    const sent=l.seq||[];
    if(l.seqStart){const nx=SEQ.find(d=>!sent.includes(d));if(nx){const due=addDays(l.seqStart,nx);if(due<=t)out.push({l,kind:`Follow-up day ${nx}`,step:nx,due,why:`Day ${nx} follow-up`});}}
    if(l.stage==='Quotation sent'&&l.follow&&l.follow<=t)out.push({l,kind:'Quotation follow-up',due:l.follow,why:'Quotation follow-up'});
    else if(l.follow&&l.follow<=t&&!out.some(o=>o.l===l))out.push({l,kind:'Follow-up day 7',due:l.follow,why:'Follow-up date reached'});
  });
  D.visits.filter(v=>v.date===t&&v.status==='Scheduled').forEach(v=>{const l=D.leads.find(x=>x.id===v.lead);if(l)out.push({l,kind:'Site visit reminder',due:t,why:`Site visit today ${v.time||''}`,visit:v});});
  return out.sort((a,b)=>a.due.localeCompare(b.due));
}

async function followDone(id,kind,step){
  const l=D.leads.find(x=>x.id===id);if(!l)return;const upd={};
  if(kind==='First reply'){upd.stage='Contacted';upd.contacted=l.contacted||Date.now();upd.seqStart=l.seqStart||today();upd.follow=addDays(today(),1);}

const RA_MAIN=['Site engineer','Architect','Client','Marketing'];
const RA_MORE=['Supervisor','Storekeeper','Structural engineer','Sub-contractor','Accountant'];
const ROLE_KEY=r=>String(r).toLowerCase().replace(/[^a-z0-9]+/g,'-');
const EDIT_TIE={pipeline:'leads',followups:'leads',leadimp:'leads',estimator:'leads',content:'cflags',attbulk:'attendance',schedule:'tasks',forms:'forms'};
const raEditable=k=>!!MOD[k]||k in EDIT_TIE;
const RA_SKIP=new Set(['settings','audit','roleaccess','adminpanel','team','dashboard','cflags']);
const PKEY=id=>'person-'+id;
function curPerson(){if(S.viewAsPerson)return D.team.find(t=>t.id===S.viewAsPerson)||null;if(S.viewAs)return null;if(isAdmin())return null;return myTeamRec()||null;}
function personOv(pid){if(!pid)return null;const o=D.roleaccess.find(x=>x.id===PKEY(pid));return o&&o.v?o.v:null;}
function raValP(t,k){const po=personOv(t&&t.id);if(po&&po[k])return po[k];return raVal(t.role,k);}
function raOverride(role){const o=D.roleaccess.find(x=>x.id===ROLE_KEY(role));return o&&o.v?o.v:null;}
function raDefaultEdit(role,k){
  if(role==='Client')return k==='changes';
  if(['Architect','Structural engineer','Draftsman','Senior architect'].includes(role))return ['documents','issues','changes','forms'].includes(k);
  return true;
}
function raVal(role,k){
  const def=ROLE_VIEWS[role];if(def===V_ALL)return 'e';
  const o=raOverride(role);if(o&&o[k])return o[k];
  if(!(def||[]).includes(k))return 'h';
  return raEditable(k)&&raDefaultEdit(role,k)?'e':'v';
}
function canEditView(k){
  const r=curRole();if(r==='none')return false;const t=curPerson();const pv=t&&t.role!=='Admin'?personOv(t.id):null;
  const val=kk=>pv&&pv[kk]?pv[kk]:raVal(r,kk);
  if(!pv&&fullAccess())return true;
  const v=val(k);if(v==='e')return true;
  const tie=EDIT_TIE[k];return tie?val(tie)==='e'&&v!=='h':false;
}
/* the screens shown in the grid for one role, grouped like the menu */
function raGroups(role){

}

async function raSetPerson(pid,changes){
  const t=D.team.find(x=>x.id===pid);if(!t)return;const cur={...(personOv(pid)||{})};
  Object.entries(changes).forEach(([k,v])=>{if(v===raVal(t.role,k))delete cur[k];else cur[k]=v;});
  const ok=Object.keys(cur).length?await write(()=>db.doc('roleaccess/'+PKEY(pid)).set({person:pid,role:t.role,name:t.name,v:cur,by:ME.id,at:Date.now()}),'Access updated for '+(t.name||'this person'))
    :await write(()=>db.doc('roleaccess/'+PKEY(pid)).delete(),(t.name||'This person')+' now follows the '+t.role+' role');
  if(ok)audit('edited','roleaccess',PKEY(pid),`${t.name}: ${Object.entries(changes).map(([k,v])=>`${label(k)} → ${{h:'hidden',v:'view only',e:'add & edit'}[v]}`).join(', ').slice(0,300)}`);
}
async function raSet(role,changes){
  const groups=raGroups(role).flatMap(g=>g[1]);const cur={};
  groups.forEach(k=>cur[k]=raVal(role,k));Object.assign(cur,changes);
  /* keep linked detail screens in step */
  ['project','form','alerts'].forEach(k=>{cur[k]=raVal(role,k);});
  if(Object.entries(cur).some(([k,v])=>v!=='h'&&!['project','form','alerts'].includes(k))){if(cur.forms!=='h'&&cur.form==='h')cur.form='v';}
  const ok=await write(()=>db.doc('roleaccess/'+ROLE_KEY(role)).set({role,v:cur,by:ME.id,at:Date.now()}),'Access updated for '+role);
  if(ok)audit('edited','roleaccess',ROLE_KEY(role),`${role}: ${Object.entries(changes).map(([k,v])=>`${label(k)} → ${{h:'hidden',v:'view only',e:'add & edit'}[v]}`).join(', ').slice(0,300)}`);
}

/* ================= Messages (group chat with mentions & read ticks) ================= */
const CAT_OF={'Admin':'owner','Project manager':'owner','Site engineer':'site','Supervisor':'site','Storekeeper':'site','Sub-contractor':'site',
  'Architect':'design','Structural engineer':'design','Client':'client','Marketing':'marketing','Accountant':'accounts'};
const CAT_NAME={owner:'Admin',site:'Site engineer',design:'Architect',client:'Client',marketing:'Marketing',accounts:'Accounts'};
const CAT_ORDER=['owner','site','client','design','marketing','accounts'];
const CO='_co'; /* company-wide chats, not tied to one project */
const CHAT_PRESETS={proj:[['owner','site','client','design'],['owner','site','client'],['owner','client','design'],['owner','site','design'],['owner','client'],['owner','site'],['owner','design'],['owner','site','client','design','marketing'],['owner','client','marketing']],
  co:[['owner','marketing'],['owner','site','design'],['owner','accounts'],['owner','site','design','marketing','accounts']]};
const grpKey=cats=>CAT_ORDER.filter(c=>cats.includes(c)).join('+');
const thKey=(pid,g)=>pid+'|'+g;
const safeId=s=>String(s).replace(/[^A-Za-z0-9_-]/g,'_');
const pnameX=pid=>pid===CO?'Company (all projects)':pname(pid);
function myChatId(){
  const t=curPerson();if(t)return t.id;
  const r=curRole();
  if(S.viewAs){const x=D.team.find(m=>m.role===r);return x?x.id:'owner';}
  const own=D.team.find(m=>m.role==='Admin'&&m.account&&m.account===ME.id)||D.team.find(m=>m.role==='Admin');
  return own?own.id:'owner';
}
const myCat=()=>{const t=D.team.find(m=>m.id===myChatId());return t?CAT_OF[t.role]||'site':(CAT_OF[curRole()]||'owner');};
function threadMembers(pid,g){
  if(g.startsWith('g:')){const d=pgDoc(g);if(!d)return [];return Object.keys(d.mm||{}).map(id=>D.team.find(t=>t.id===id)||(id==='owner'?{id:'owner',name:'Owner',role:'Admin'}:null)).filter(Boolean);}
  const cats=g.split('+');
  const ms=D.team.filter(t=>t.status!=='Removed'&&cats.includes(CAT_OF[t.role])&&!(pid===CO&&CAT_OF[t.role]==='client')&&(pid===CO||CAT_OF[t.role]==='owner'||(t.projects||[]).includes('all')||(t.projects||[]).includes(pid)));
  if(!ms.some(t=>CAT_OF[t.role]==='owner'))ms.unshift({id:'owner',name:'Owner',role:'Admin'});
  return ms;
}
const chatName=id=>{const t=D.team.find(m=>m.id===id);return t?t.name:id==='owner'?'Owner':'Someone';};
const chatRole=id=>{const t=D.team.find(m=>m.id===id);return t?t.role:'Admin';};
function lastSeen(key,id){const d=D.chatseen.find(x=>x.id===safeId(key+'__'+id));return d?n(d.last):0;}
function myThreads(){
  const me=myChatId(),cat=myCat(),isOwn=cat==='owner';
  const pids=[CO,...PJ().map(p=>p.id)];const out=[];
  pids.forEach(pid=>{
    const custom=D.chatgroups.filter(g=>g.project===pid&&g.grp).map(g=>g.grp.split('+'));
    const used=new Set(D.chats.filter(c=>c.project===pid&&!String(c.grp).startsWith('g:')).map(c=>c.grp));
    const list=[...(pid===CO?CHAT_PRESETS.co:CHAT_PRESETS.proj),...custom,...[...used].map(g=>g.split('+'))];
    const seen=new Set();
    list.forEach(cats=>{const g=grpKey(cats);if(seen.has(g))return;seen.add(g);
      if(!isOwn&&!g.split('+').includes(cat))return;
      if(pid===CO&&cat==='client')return;
      if(pid!==CO&&!isOwn&&!projOK(pid))return;
      const key=thKey(pid,g);const msgs=D.chats.filter(c=>c.project===pid&&c.grp===g&&visMsg(key,c)).sort((a,b)=>a.at-b.at);

let SW=null,LP=null;
document.addEventListener('pointerdown',e=>{
  if(e.button!==undefined&&e.button!==0)return;
  const row=e.target.closest&&e.target.closest('.swr');
  if(row&&!e.target.closest('.pinb'))SW={row,inner:row.querySelector('.chat-th'),x:e.clientX,y:e.clientY,dx:0,on:false,w:row.offsetWidth||300};
  const b=e.target.closest&&e.target.closest('.bub[data-mid]');
  if(b&&!e.target.closest('a,button,textarea,input')&&!b.classList.contains('del')){const id=b.dataset.mid;LP={x:e.clientX,y:e.clientY,fired:false,t:setTimeout(()=>{LP&&(LP.fired=true);S._noClick=Date.now();try{navigator.vibrate&&navigator.vibrate(15);}catch(_){}openMsgMenu(id);},480)};}
});
document.addEventListener('pointermove',e=>{
  if(LP&&(Math.abs(e.clientX-LP.x)>8||Math.abs(e.clientY-LP.y)>8)){clearTimeout(LP.t);LP=null;}
  if(!SW)return;const dx=e.clientX-SW.x,dy=e.clientY-SW.y;
  if(!SW.on){if(Math.abs(dx)>10&&Math.abs(dx)>Math.abs(dy)*1.3){SW.on=true;SW.row.classList.add('swiping');}else if(Math.abs(dy)>12){SW=null;return;}else return;}
  SW.dx=dx;SW.inner.style.transform=`translateX(${dx}px)`;
  SW.row.classList.toggle('to-r',dx>0);SW.row.classList.toggle('to-l',dx<0);SW.row.classList.toggle('arm',Math.abs(dx)>=SW.w*0.35);
});
const swEnd=()=>{if(LP){clearTimeout(LP.t);LP=null;}
  if(!SW)return;const s=SW;SW=null;if(!s.on)return;S._noClick=Date.now();
  const done=Math.abs(s.dx)>=s.w*0.35;const key=s.row.dataset.swkey;
  s.inner.style.transition='transform .18s';s.inner.style.transform=done?`translateX(${s.dx>0?s.w:-s.w}px)`:'translateX(0)';
  setTimeout(()=>{s.inner.style.transition='';s.row.classList.remove('swiping','to-r','to-l','arm');if(done)chatSwipe(key,s.dx>0?'right':'left');else s.inner.style.transform='';},190);};
