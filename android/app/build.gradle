plugins { id 'com.android.application' }
// versionCode goes up by itself on every CI build (-Pvcode), as Google Play needs a higher number for each upload.
def vcode = (project.findProperty('vcode') ?: '2') as int
android {
    namespace 'com.buildmitr.app'
    compileSdk 36
    defaultConfig {
        applicationId "com.buildmitr.app"
        minSdk 24
        targetSdk 36
        versionCode vcode
        versionName "1.1." + vcode
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
